&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;style&gt;
#porsche-sales-dashboard{--bg:light-dark(#f4f4f2,#111);--surface:light-dark(#fff,#1b1b1b);--soft:light-dark(#f5f5f4,#252525);--ink:light-dark(#171717,#f3f3f3);--muted:light-dark(#666,#b7b7b7);--line:light-dark(#d9d9d7,#3c3c3c);--red:#d5001c;color-scheme:light dark;color:var(--ink);background:var(--bg);font:400 14px/1.5 &quot;Helvetica Neue&quot;,Arial,sans-serif;width:100%;box-sizing:border-box;padding:0 22px 28px}

#porsche-sales-dashboard .shell{max-width:1180px;margin:0 auto}
#porsche-sales-dashboard .topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}
#porsche-sales-dashboard .brand{display:flex;align-items:center;gap:15px}
#porsche-sales-dashboard .wordmark{font-size:17px;font-weight:500;letter-spacing:.22em}
#porsche-sales-dashboard .divider{height:21px;width:1px;background:var(--line)}
#porsche-sales-dashboard .brand-caption,#porsche-sales-dashboard .top-note,#porsche-sales-dashboard .overline{color:var(--muted);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
#porsche-sales-dashboard .top-note{text-align:right;letter-spacing:.08em}
#porsche-sales-dashboard .hero{padding:27px 0 22px}
#porsche-sales-dashboard .overline{color:var(--red);font-weight:500;margin:0 0 7px}
#porsche-sales-dashboard h1{font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.035em;font-weight:500;margin:0}
#porsche-sales-dashboard .subtitle{margin:9px 0 0;color:var(--muted);max-width:720px}#porsche-sales-dashboard .region-note{color:var(--muted);font-size:12px;margin:5px 0 0}
#porsche-sales-dashboard .filter-area{background:var(--surface);border-top:2px solid var(--ink);padding:17px 18px 18px;margin:2px 0 20px}
#porsche-sales-dashboard .filter-head,#porsche-sales-dashboard .section-title{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 12px}
#porsche-sales-dashboard h2{font-size:18px;line-height:1.25;letter-spacing:-.015em;font-weight:500;margin:0}
#porsche-sales-dashboard .filter-head p,#porsche-sales-dashboard .section-title p{margin:0;color:var(--muted);font-size:12px}
#porsche-sales-dashboard .controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
#porsche-sales-dashboard .field{min-width:0}
#porsche-sales-dashboard .field label{display:block;font-size:12px;font-weight:500;margin:0 0 5px}
#porsche-sales-dashboard select,#porsche-sales-dashboard input[type=date]{display:block;width:100%;min-width:0;height:44px;padding:8px 10px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;font:inherit}

#porsche-sales-dashboard .validation:empty{display:none}
#porsche-sales-dashboard .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 24px}

#porsche-sales-dashboard .kpi-value{display:block;font-size:clamp(20px,2.8vw,27px);line-height:1.2;font-weight:500;margin-top:4px;overflow-wrap:anywhere}

#porsche-sales-dashboard .bar-label{overflow-wrap:anywhere}
#porsche-sales-dashboard .bar-track{display:block;height:8px;background:var(--soft)}
#porsche-sales-dashboard .bar-fill{display:block;height:100%;background:var(--red)}
#porsche-sales-dashboard .bar-value{text-align:right;font-variant-numeric:tabular-nums}#porsche-sales-dashboard .trend-chart{grid-column:1/-1}#porsche-sales-dashboard .trend-wrap{width:100%;min-width:0}#porsche-sales-dashboard .trend-svg{display:block;width:100%;height:auto;overflow:visible}#porsche-sales-dashboard .trend-svg .grid{stroke:var(--line);stroke-width:1}#porsche-sales-dashboard .trend-svg .axis{stroke:var(--muted);stroke-width:1}#porsche-sales-dashboard .trend-svg .series-line{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}#porsche-sales-dashboard .trend-svg .point{fill:var(--red);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}#porsche-sales-dashboard .trend-svg text{fill:var(--muted);font-size:12px;font-family:inherit}#porsche-sales-dashboard .trend-svg .axis-title{fill:var(--ink)}
#porsche-sales-dashboard .no-data{padding:15px 0;color:var(--muted)}
#porsche-sales-dashboard .city-chart{grid-column:1/-1}
#porsche-sales-dashboard .city-chart .bar-row{grid-template-columns:minmax(125px,190px) minmax(70px,1fr) 32px}
#porsche-sales-dashboard .table-section{margin-top:24px}
#porsche-sales-dashboard .table-wrap{overflow-x:auto;background:var(--surface)}
#porsche-sales-dashboard table{width:100%;border-collapse:collapse;text-align:left}
#porsche-sales-dashboard th{color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
#porsche-sales-dashboard td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
#porsche-sales-dashboard tbody tr:last-child td{border-bottom:0}
#porsche-sales-dashboard .number{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#porsche-sales-dashboard .source-note{color:var(--muted);font-size:12px;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
#porsche-sales-dashboard .red-dot{display:inline-block;width:7px;height:7px;background:var(--red);margin-right:7px}
@media(max-width:850px){#porsche-sales-dashboard{padding-left:16px;padding-right:16px}#porsche-sales-dashboard .controls{grid-template-columns:repeat(3,minmax(0,1fr))}#porsche-sales-dashboard .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}#porsche-sales-dashboard .kpi:nth-child(3){border-left:0;border-top:1px solid var(--line)}#porsche-sales-dashboard .kpi:nth-child(4){border-top:1px solid var(--line)}}
@media(max-width:560px){#porsche-sales-dashboard{padding-left:12px;padding-right:12px}#porsche-sales-dashboard .topbar{min-height:52px}#porsche-sales-dashboard .brand{gap:9px}#porsche-sales-dashboard .wordmark{font-size:15px}#porsche-sales-dashboard .brand-caption,#porsche-sales-dashboard .top-note{font-size:9px}#porsche-sales-dashboard .hero{padding-top:22px}#porsche-sales-dashboard .filter-area{padding:14px 12px}#porsche-sales-dashboard .filter-head{display:block}#porsche-sales-dashboard .filter-head p{margin-top:4px}#porsche-sales-dashboard .controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#porsche-sales-dashboard .kpi{padding:12px 11px}#porsche-sales-dashboard .kpi-value{font-size:20px}#porsche-sales-dashboard .chart-grid{grid-template-columns:minmax(0,1fr);gap:18px}#porsche-sales-dashboard .city-chart{grid-column:auto}#porsche-sales-dashboard .section-title{display:block}#porsche-sales-dashboard .section-title p{margin-top:4px}#porsche-sales-dashboard .bar-row,#porsche-sales-dashboard .city-chart .bar-row{grid-template-columns:minmax(95px,1fr) 30px;gap:4px 10px;padding:3px 0}#porsche-sales-dashboard .bar-track{grid-column:1/-1;grid-row:2}#porsche-sales-dashboard .bar-value{grid-column:2;grid-row:1}#porsche-sales-dashboard table{min-width:520px}}
